name: Release

# Tags are bare SemVer, no v prefix. In GitHub's ref filter syntax `+` means "one or
# more of the preceding character" and `.` is literal, so these match 1.2.0 and
# 1.3.0-rc.1 and reject v1.2.0.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # merge-base on a shallow clone answers wrongly rather than erroring, so the
      # whole history is required here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag push event carries no branch, so "only tags on main publish" has to be
      # computed as reachability from main.
      - name: tag must be reachable from main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }

  changelog:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.extract.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # Runs before anything is published, so a forgotten changelog entry blocks the
      # release instead of shipping an empty one.
      - name: extract release notes
        id: extract
        run: |
          version="$GITHUB_REF_NAME"
          awk -v v="$version" '
            BEGIN { gsub(/\./, "\\.", v) }
            $0 ~ "^## \\[?" v "\\]?( |$)" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  # One image, because the Dockerfile now runs the api and the worker as two processes
  # under one entrypoint. A matrix here would push the same bytes twice under two names.
  publish:
    needs: [guard, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=auto leaves `latest` where it is for a prerelease tag. The semver
      # patterns parse the bare tag; the v prefix is optional to this action.
      - name: image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/phage-solutions/raider-mate-service
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Last, so a failed image build leaves no release pointing at images that do not
  # exist.
  release:
    needs: [changelog, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.changelog.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
