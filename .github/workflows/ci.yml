name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check commits are signed off
        run: |
          missing=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $sha ($(git log -1 --format=%s "$sha")) is missing a Signed-off-by trailer"
              missing=1
            fi
          done
          exit "$missing"

  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test-integration
        run: go test -tags=integration ./...

      - name: lint
        run: go tool golangci-lint run
